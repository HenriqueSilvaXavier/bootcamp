<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">
  <div class="card shadow">
    <div class="card-body">
      <h2 class="mb-4">Edit</h2>

      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="editForm">
        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Title</label>
            <input type="text" id="title" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Director</label>
            <input type="text" id="director" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Genre</label>
            <input type="text" id="genre" class="form-control" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Year</label>
            <input type="number" id="releaseYear" class="form-control" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Duration</label>
            <input type="number" id="duration" class="form-control" required>
          </div>

          <!-- 🎬 Animation -->
          <div id="animationFields" style="display:none" class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Studio</label>
              <input type="text" id="animationStudio" class="form-control">
            </div>

            <div class="col-md-6 form-check mt-4 ms-2">
              <input class="form-check-input" type="checkbox" id="dubbed">
              <label class="form-check-label">Dubbed</label>
            </div>
          </div>

          <!-- 🎥 Documentary -->
          <div id="documentaryFields" style="display:none" class="row g-3">
            <div class="col-md-6 form-check mt-4 ms-2">
              <input class="form-check-input" type="checkbox" id="narrated">
              <label class="form-check-label">Narrated</label>
            </div>
          </div>

          <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary">Save</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const FILM_API = "http://localhost:5002/api/films";
  const ANIMATION_API = "http://localhost:5002/api/animations";
  const DOCUMENTARY_API = "http://localhost:5002/api/documentaries";

  const title = document.getElementById("title");
  const director = document.getElementById("director");
  const genre = document.getElementById("genre");
  const releaseYear = document.getElementById("releaseYear");
  const duration = document.getElementById("duration");

  const animationStudio = document.getElementById("animationStudio");
  const dubbed = document.getElementById("dubbed");
  const narrated = document.getElementById("narrated");

  const animationFields = document.getElementById("animationFields");
  const documentaryFields = document.getElementById("documentaryFields");
  const editForm = document.getElementById("editForm");

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const type = params.get("type");

  if (!id || !type) {
    alert("Invalid parameters");
    window.location.href = "/";
  }

  /* Define correct API */
  let API = FILM_API;
  if (type === "animation") API = ANIMATION_API;
  if (type === "documentary") API = DOCUMENTARY_API;

  /* Show specific fields */
  if (type === "animation") animationFields.style.display = "flex";
  if (type === "documentary") documentaryFields.style.display = "flex";

  /* Load data */
  fetch(`${API}/${id}`)
          .then(r => r.json())
          .then(item => {
            title.value = item.title;
            director.value = item.director;
            genre.value = item.genre;
            releaseYear.value = item.releaseYear;
            duration.value = item.duration;

            if (type === "animation") {
              animationStudio.value = item.animationStudio;
              dubbed.checked = item.dubbed;
            }

            if (type === "documentary") {
              narrated.checked = item.narrated;
            }
          });

  /* Save */
  const errorAlert = document.getElementById("errorAlert");

  /* Save */
  editForm.addEventListener("submit", e => {
    e.preventDefault();

    errorAlert.classList.add("d-none");
    errorAlert.textContent = "";

    const base = {
      title: title.value,
      director: director.value,
      genre: genre.value,
      releaseYear: parseInt(releaseYear.value),
      duration: parseInt(duration.value)
    };

    let body = base;

    if (type === "animation") {
      body = { ...base, animationStudio: animationStudio.value, dubbed: dubbed.checked };
    }

    if (type === "documentary") {
      body = { ...base, narrated: narrated.checked };
    }

    fetch(`${API}/${id}`, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body)
    })
            .then(async r => {
              if (!r.ok) {
                const error = await r.json().catch(() => null);
                throw new Error(error?.message || "Unknown error");
              }
              return r.json();
            })
            .then(() => {
              alert("Updated!");
              window.location.href = "/";
            })
            .catch(e => {
              errorAlert.textContent = e.message;
              errorAlert.classList.remove("d-none");
            });
  });
</script>

</body>
</html>
