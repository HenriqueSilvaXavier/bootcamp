<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4">📚 Sistema de Catálogo</h1>

    <!-- Cadastrar -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">➕ Cadastrar</h5>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Tipo</label>
                    <select id="type" class="form-select" onchange="toggleTipo()">
                        <option value="film">Filme</option>
                        <option value="animation">Animação</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <input type="text" id="title" class="form-control" placeholder="Título">
                </div>

                <div class="col-md-6">
                    <input type="text" id="director" class="form-control" placeholder="Diretor">
                </div>

                <div class="col-md-6">
                    <input type="text" id="genre" class="form-control" placeholder="Gênero">
                </div>

                <div class="col-md-6">
                    <input type="number" id="releaseYear" class="form-control" placeholder="Ano">
                </div>

                <div class="col-md-6">
                    <input type="number" id="duration" class="form-control" placeholder="Duração (min)">
                </div>

                <!-- Campos de Animação -->
                <div id="animationFields" style="display:none" class="row g-3">
                    <div class="col-md-6">
                        <input type="text" id="animationStudio" class="form-control" placeholder="Estúdio de animação">
                    </div>

                    <div class="col-md-6 form-check mt-2 ms-2">
                        <input class="form-check-input" type="checkbox" id="dubbed">
                        <label class="form-check-label">Dublado</label>
                    </div>
                </div>

                <div class="col-12">
                    <button class="btn btn-primary" onclick="cadastrar()">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Buscar por ID -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">🔍 Buscar por ID</h5>

            <div class="input-group mb-3">
                <input type="number" id="searchId" class="form-control" placeholder="ID">
                <button class="btn btn-secondary" onclick="buscarPorId()">Buscar</button>
            </div>

            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Diretor</th>
                    <th>Gênero</th>
                    <th>Ano</th>
                    <th>Duração</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="searchedTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Lista -->
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title m-0">📚 Lista Completa</h5>
                <button class="btn btn-success" onclick="listarTudo()">Atualizar</button>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Diretor</th>
                        <th>Gênero</th>
                        <th>Ano</th>
                        <th>Duração</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody id="listaTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const FILM_API = "http://localhost:8080/api/films";
    const ANIMATION_API = "http://localhost:8080/api/animations";

    const PAGE_SIZE = 5;
    let filmPage = 0;
    let animationPage = 0;

    function toggleTipo() {
        animationFields.style.display =
            type.value === "animation" ? "flex" : "none";
    }

    function cadastrar() {
        const tipo = type.value;

        const base = {
            title: title.value,
            director: director.value,
            genre: genre.value,
            releaseYear: parseInt(releaseYear.value),
            duration: parseInt(duration.value)
        };

        let url = FILM_API;
        let body = base;

        if (tipo === "animation") {
            url = ANIMATION_API;
            body = {
                ...base,
                animationStudio: animationStudio.value,
                dubbed: dubbed.checked
            };
        }

        fetch(url, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(body)
        })
            .then(r => r.json())
            .then(d => {
                alert("Cadastrado! ID: " + d.id);
                listarTudo();
            });
    }

    function listarTudo() {
        listaTable.innerHTML = "";
        listarFilmes();
        listarAnimacoes();
    }

    function listarFilmes() {
        fetch(`${FILM_API}?page=${filmPage}&size=${PAGE_SIZE}`)
            .then(r => r.json())
            .then(data => renderLista(data.content, "film"));
    }

    function listarAnimacoes() {
        fetch(`${ANIMATION_API}?page=${animationPage}&size=${PAGE_SIZE}`)
            .then(r => r.json())
            .then(data => renderLista(data.content, "animation"));
    }

    function renderLista(lista, tipo) {
        lista.forEach(item => {
            const extra = tipo === "animation"
                ? `<br><small>🎞️ ${item.animationStudio} | ${item.dubbed ? 'Dublado' : 'Legendado'}</small>`
                : `<br><small>🎬 Filme</small>`;

            listaTable.innerHTML += `
            <tr>
                <td>${item.id}</td>
                <td>${item.title}${extra}</td>
                <td>${item.director}</td>
                <td>${item.genre}</td>
                <td>${item.releaseYear}</td>
                <td>${item.duration}</td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="editar(${item.id}, '${tipo}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="deletar(${item.id}, '${tipo}')">🗑️</button>
                </td>
            </tr>
        `;
        });
    }

    function buscarPorId() {
        const id = searchId.value;
        searchedTable.innerHTML = "";

        fetch(`${FILM_API}/${id}`)
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(item => renderBusca(item, "film"))
            .catch(() => {
                fetch(`${ANIMATION_API}/${id}`)
                    .then(r => r.ok ? r.json() : Promise.reject())
                    .then(item => renderBusca(item, "animation"))
                    .catch(() => alert("Item não encontrado"));
            });
    }

    function renderBusca(item, tipo) {
        const extra = tipo === "animation"
            ? `<br><small>🎞️ ${item.animationStudio} | ${item.dubbed ? 'Dublado' : 'Legendado'}</small>`
            : `<br><small>🎬 Filme</small>`;

        searchedTable.innerHTML = `
        <tr>
            <td>${item.id}</td>
            <td>${item.title}${extra}</td>
            <td>${item.director}</td>
            <td>${item.genre}</td>
            <td>${item.releaseYear}</td>
            <td>${item.duration}</td>
            <td>
                <button class="btn btn-sm btn-primary" onclick="editar(${item.id}, '${tipo}')">✏️</button>
                <button class="btn btn-sm btn-danger" onclick="deletar(${item.id}, '${tipo}')">🗑️</button>
            </td>
        </tr>
    `;
    }

    function deletar(id, tipo) {
        if (!confirm("Tem certeza?")) return;

        const api = tipo === "animation" ? ANIMATION_API : FILM_API;

        fetch(`${api}/${id}`, { method: "DELETE" })
            .then(() => {
                alert("Deletado!");
                listarTudo();
                searchedTable.innerHTML = "";
            });
    }

    function editar(id, tipo) {
        window.location.href = `edit?id=${id}&type=${tipo}`;
    }

    listarTudo();
</script>

</body>
</html>
