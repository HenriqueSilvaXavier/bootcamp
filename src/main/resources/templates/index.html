<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animation and Documentary Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4">Catalog System</h1>

    <!-- Create / Edit -->
    <div class="card mb-4">
        <!-- Error Alert -->
        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
        <div class="card-body">
            <h5 class="card-title">Register</h5>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Type</label>
                    <select id="type" class="form-select" onchange="toggleType()">
                        <option value="animation">Animation</option>
                        <option value="documentary">Documentary</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <input type="text" id="title" class="form-control" placeholder="Title">
                </div>

                <div class="col-md-6">
                    <input type="text" id="director" class="form-control" placeholder="Director">
                </div>

                <div class="col-md-6">
                    <input type="text" id="genre" class="form-control" placeholder="Genre">
                </div>

                <div class="col-md-6">
                    <input type="number" id="releaseYear" class="form-control" placeholder="Year">
                </div>

                <div class="col-md-6">
                    <input type="number" id="duration" class="form-control" placeholder="Duration (min)">
                </div>

                <!-- Animation Fields -->
                <div id="animationFields" style="display:none" class="row g-3">
                    <div class="col-md-6">
                        <input type="text" id="animationStudio" class="form-control" placeholder="Animation Studio">
                    </div>
                    <div class="col-md-6 form-check mt-2 ms-2">
                        <input class="form-check-input" type="checkbox" id="dubbed">
                        <label class="form-check-label">Dubbed</label>
                    </div>
                </div>

                <!-- Documentary Fields -->
                <div id="documentaryFields" style="display:none" class="row g-3">
                    <div class="col-md-6 form-check mt-2 ms-2">
                        <input class="form-check-input" type="checkbox" id="narrated">
                        <label class="form-check-label">Narrated</label>
                    </div>
                </div>

                <div class="col-12">
                    <button id="btnSave" class="btn btn-primary" onclick="save()">Register</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Animations -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0">Animations</h5>
                <div class="input-group w-auto">
                    <input type="number" id="searchAnimationId" class="form-control" placeholder="Search by ID">
                    <button class="btn btn-secondary" onclick="searchById('animation')">Search</button>
                    <button class="btn btn-success" onclick="listAnimations()">Refresh</button>
                </div>
            </div>
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Director</th>
                    <th>Genre</th>
                    <th>Year</th>
                    <th>Duration</th>
                    <th>Studio</th>
                    <th>Dubbed</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="animationTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Documentaries -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0">Documentaries</h5>
                <div class="input-group w-auto">
                    <input type="number" id="searchDocumentaryId" class="form-control" placeholder="Search by ID">
                    <button class="btn btn-secondary" onclick="searchById('documentary')">Search</button>
                    <button class="btn btn-success" onclick="listDocumentaries()">Refresh</button>
                </div>
            </div>
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Director</th>
                    <th>Genre</th>
                    <th>Year</th>
                    <th>Duration</th>
                    <th>Narrated</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="documentaryTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const ANIMATION_API = "http://localhost:5002/api/animations";
    const DOCUMENTARY_API = "http://localhost:5002/api/documentaries";

    let editingId = null;
    let editingType = null;

    const animationFields = document.getElementById("animationFields");
    const documentaryFields = document.getElementById("documentaryFields");
    const typeSelect = document.getElementById("type");

    const titleInput = document.getElementById("title");
    const directorInput = document.getElementById("director");
    const genreInput = document.getElementById("genre");
    const releaseYearInput = document.getElementById("releaseYear");
    const durationInput = document.getElementById("duration");

    const animationStudioInput = document.getElementById("animationStudio");
    const dubbedInput = document.getElementById("dubbed");
    const narratedInput = document.getElementById("narrated");

    const animationTable = document.getElementById("animationTable");
    const documentaryTable = document.getElementById("documentaryTable");

    function toggleType() {
        animationFields.style.display = typeSelect.value === "animation" ? "block" : "none";
        documentaryFields.style.display = typeSelect.value === "documentary" ? "block" : "none";
    }

    function save() {
        if (editingId) update();
        else create();
    }

    function create() {
        hideError(); // esconde alerta antigo
        const type = typeSelect.value;

        const base = {
            title: titleInput.value,
            director: directorInput.value,
            genre: genreInput.value,
            releaseYear: parseInt(releaseYearInput.value),
            duration: parseInt(durationInput.value)
        };

        let url = ANIMATION_API;
        let body = {};

        if (type === "animation") {
            body = { ...base, animationStudio: animationStudioInput.value, dubbed: dubbedInput.checked };
        } else {
            url = DOCUMENTARY_API;
            body = { ...base, narrated: narratedInput.checked };
        }

        fetch(url, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(body)
        })
            .then(async r => {
                if (!r.ok) {
                    const error = await r.json().catch(() => null);
                    throw new Error(error?.message || "Unknown error");
                }
                return r.json();
            })
            .then(data => {
                // Mostrar alerta de sucesso, se quiser
                alert("Added! ID: " + (data.id ?? "N/A"));

                // Atualiza as tabelas
                listAnimations();
                listDocumentaries();
            })
            .catch(e => showError(e.message));
    }

    function edit(id, type) {
        const api = type === "animation" ? ANIMATION_API : DOCUMENTARY_API;

        fetch(`${api}/${id}`)
            .then(r => r.json())
            .then(item => {
                editingId = id;
                editingType = type;

                typeSelect.value = type;
                toggleType();

                titleInput.value = item.title;
                directorInput.value = item.director;
                genreInput.value = item.genre;
                releaseYearInput.value = item.releaseYear;
                durationInput.value = item.duration;

                if (type === "animation") {
                    animationStudioInput.value = item.animationStudio;
                    dubbedInput.checked = item.dubbed;
                } else {
                    narratedInput.checked = item.narrated;
                }

                document.getElementById("btnSave").textContent = "Update";
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
    }

    function update() {
        const base = {
            title: titleInput.value,
            director: directorInput.value,
            genre: genreInput.value,
            releaseYear: parseInt(releaseYearInput.value),
            duration: parseInt(durationInput.value)
        };

        let url, body;

        if (editingType === "animation") {
            url = `${ANIMATION_API}/${editingId}`;
            body = { ...base, animationStudio: animationStudioInput.value, dubbed: dubbedInput.checked };
        } else {
            url = `${DOCUMENTARY_API}/${editingId}`;
            body = { ...base, narrated: narratedInput.checked };
        }

        fetch(url, {
            method: "PUT",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify(body)
        })
            .then(() => {
                cancelEdit();
                listAnimations();
                listDocumentaries();
            });
    }

    function cancelEdit() {
        editingId = null;
        editingType = null;
        document.getElementById("btnSave").textContent = "Create";

        titleInput.value = "";
        directorInput.value = "";
        genreInput.value = "";
        releaseYearInput.value = "";
        durationInput.value = "";
        animationStudioInput.value = "";
        dubbedInput.checked = false;
        narratedInput.checked = false;
    }

    function listAnimations() {
        animationTable.innerHTML = "";
        fetch(ANIMATION_API)
            .then(r => r.json())
            .then(data => {
                const list = data.content ?? data;
                list.forEach(a => {
                    animationTable.insertAdjacentHTML("beforeend", `
                    <tr>
                        <td>${a.id}</td>
                        <td>${a.title}</td>
                        <td>${a.director}</td>
                        <td>${a.genre}</td>
                        <td>${a.releaseYear}</td>
                        <td>${a.duration}</td>
                        <td>${a.animationStudio}</td>
                        <td>${a.dubbed ? 'Yes' : 'No'}</td>
                        <td>
                            <button class="btn btn-sm btn-primary"
                                onclick="goToEdit(${a.id}, 'animation')">✏️</button>
                            <button class="btn btn-sm btn-danger"
                                onclick="deleteItem(${a.id}, 'animation')">🗑️</button>
                        </td>
                    </tr>`);
                });
            });
    }

    function listDocumentaries() {
        documentaryTable.innerHTML = "";
        fetch(DOCUMENTARY_API)
            .then(r => r.json())
            .then(data => {
                const list = data.content ?? data;
                list.forEach(d => {
                    documentaryTable.insertAdjacentHTML("beforeend", `
                    <tr>
                        <td>${d.id}</td>
                        <td>${d.title}</td>
                        <td>${d.director}</td>
                        <td>${d.genre}</td>
                        <td>${d.releaseYear}</td>
                        <td>${d.duration}</td>
                        <td>${d.narrated ? 'Yes' : 'No'}</td>
                        <td>
                            <button class="btn btn-sm btn-primary"
                                onclick="goToEdit(${d.id}, 'documentary')">✏️</button>
                            <button class="btn btn-sm btn-danger"
                                onclick="deleteItem(${d.id}, 'documentary')">🗑️</button>
                        </td>
                    </tr>`);
                });
            });
    }

    function searchById(type) {
        const id = type === "animation"
            ? document.getElementById("searchAnimationId").value
            : document.getElementById("searchDocumentaryId").value;

        const table = type === "animation" ? animationTable : documentaryTable;
        const api = type === "animation" ? ANIMATION_API : DOCUMENTARY_API;

        fetch(`${api}/${id}`)
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(item => {
                table.innerHTML = `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.title}</td>
                    <td>${item.director}</td>
                    <td>${item.genre}</td>
                    <td>${item.releaseYear}</td>
                    <td>${item.duration}</td>
                    <td>${type === 'documentary'
                    ? (item.narrated ? 'Yes' : 'No')
                    : (item.dubbed ? 'Yes' : 'No')}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="edit(${item.id}, '${type}')">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteItem(${item.id}, '${type}')">🗑️</button>
                    </td>
                </tr>`;
            })
            .catch(() => alert("Item not found"));
    }

    function deleteItem(id, type) {
        if (!confirm("Are you sure?")) return;
        const api = type === "animation" ? ANIMATION_API : DOCUMENTARY_API;
        fetch(`${api}/${id}`, { method: "DELETE" })
            .then(() => {
                listAnimations();
                listDocumentaries();
            });
    }

    function goToEdit(id, type) {
        window.location.href = `/edit?id=${id}&type=${type}`;
    }

    window.onload = () => {
        toggleType();
        listAnimations();
        listDocumentaries();
    };

    function showError(message) {
        const alertDiv = document.getElementById("errorAlert");
        alertDiv.textContent = message; // mostra o texto do backend
        alertDiv.classList.remove("d-none");
    }

    function hideError() {
        const alertDiv = document.getElementById("errorAlert");
        alertDiv.classList.add("d-none");
        alertDiv.textContent = "";
    }
</script>

</body>
</html>
